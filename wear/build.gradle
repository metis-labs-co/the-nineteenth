// Wear OS companion module. Lives here (committed) and is copied into the
// generated android/ by plugins/withWearOs.js during `expo prebuild`, since
// android/ itself is gitignored/regenerated. AGP + Kotlin are inherited from the
// root buildscript classpath; the Compose compiler plugin is added to that
// classpath by the config plugin (Kotlin 2.0 requires it).
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    namespace 'com.the.nineteenth.golf.wear'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        // Matches the phone applicationId so the Data Layer treats them as the
        // same app (needed in Spec 2). They install on separate devices.
        applicationId 'com.the.nineteenth.golf'
        minSdkVersion 30 // Wear OS 3
        // Pinned to 34 (not the app's 35): Wear Compose 1.4's SwipeDismissableNavHost
        // reads the reduce_motion global setting, which targetSdk 35 forbids
        // (SecurityException). Revisit when bumping Wear Compose to a fixed version.
        targetSdkVersion 34
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation' // standard Pager
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.wear.compose:compose-material:1.4.0'
    implementation 'androidx.wear.compose:compose-foundation:1.4.0'
    implementation 'androidx.wear.compose:compose-navigation:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'

    // Watch GPS for distance-to-green.
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Phone<->watch Data Layer + snapshot (de)serialization.
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    testImplementation 'junit:junit:4.13.2'
}
